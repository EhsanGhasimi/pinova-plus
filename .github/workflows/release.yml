name: Build and Release WordPress Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Plugin Directory
        run: |
          mkdir -p build/pinova-plus
          cp -r includes build/pinova-plus/
          cp pinova-plus.php build/pinova-plus/
          cp README.md build/pinova-plus/
          cp LICENSE build/pinova-plus/
          cd build
          zip -r ../pinova-plus.zip pinova-plus

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: pinova-plus.zip
          generate_release_notes: true
